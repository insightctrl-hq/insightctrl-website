<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/insightctrl_favicon.png" />
    <link rel="apple-touch-icon" href="/insightctrl_favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070D1A" />
    <link
      rel="preload"
      href="/fonts/Satoshi-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/logo.png" as="image" />
    <link rel="preload" href="/logo-light.png" as="image" />
    <title>InsightCTRL — Operational Advisory</title>
    <meta
      name="description"
      content="InsightCTRL is an operational advisory firm for founders, business owners, and growing organisations in Nigeria. Take the free Operational Audit to find out what to fix first."
    />
  </head>
  <body>
    <script>
      // Set the theme before first paint so a light-mode visitor never sees a dark flash.
      (function () {
        try {
          var stored = localStorage.getItem('insightctrl-theme')
          document.documentElement.setAttribute('data-theme', stored === 'light' ? 'light' : 'dark')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
