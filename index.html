<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />
    <link
      rel="preload"
      href="/fonts/Satoshi-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/logo.png" as="image" />
    <link rel="preload" href="/logo-light.png" as="image" />
    <title>InsightCTRL: Operational Advisory</title>
    <meta
      name="description"
      content="InsightCTRL builds the systems that let a business run when its owner is not in the room. Take the free diagnostic to find what to fix first."
    />
    <!-- Link previews (WhatsApp, LinkedIn, X). Crawlers don't run scripts, so these sit in
         the HTML and apply to every page. Copy approved 17 Nov 2026. The image URL is
         absolute because crawlers need it: update it when the custom domain arrives. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="InsightCTRL" />
    <meta property="og:title" content="InsightCTRL: Operational Advisory" />
    <meta
      property="og:description"
      content="InsightCTRL builds the systems that let a business run when its owner is not in the room. Take the free diagnostic to find what to fix first."
    />
    <meta property="og:image" content="https://insightctrlhq.netlify.app/share.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="InsightCTRL. Take CTRL of your business. Run our free diagnostic." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="InsightCTRL: Operational Advisory" />
    <meta
      name="twitter:description"
      content="InsightCTRL builds the systems that let a business run when its owner is not in the room. Take the free diagnostic to find what to fix first."
    />
    <meta name="twitter:image" content="https://insightctrlhq.netlify.app/share.png" />
  </head>
  <body>
    <script>
      // Set the theme before first paint so a visitor who chose dark never sees a light flash.
      (function () {
        try {
          var stored = localStorage.getItem('insightctrl-theme-choice')
          document.documentElement.setAttribute('data-theme', stored === 'dark' ? 'dark' : 'light')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
